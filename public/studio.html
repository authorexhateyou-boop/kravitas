<!doctype html>
<html lang="en">

<body>
<header class="top fl">
  <a class="logo" href="./" title="Kravitas home">kravitas</a>
  <label class="fl-search"><span>⌕</span><input id="fl-q" type="search" placeholder="Search your media" autocomplete="off"></label>

    <button class="icon" data-guide-show title="Show the step-by-step guide">?</button>
    <button class="icon" data-open="settings" title="Settings">⚙</button>

    <button class="avatar" data-open="profile" title="Your account" id="me-av">K</button>
  </div>
</header>

<main id="main">
  <section id="presets"></section>
  <section id="feed"></section>
  <footer class="foot">© Kravitas · <a href="terms">Terms</a> · <a href="privacy">Privacy</a></footer>

<div id="pop" class="pop" hidden></div>
<div id="modal" class="modal" hidden></div>

<script src="i18n.js"></script>
